<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>203</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #FDF8F2;
  --warm-white: #FEFCF9;
  --ink: #1A1614;
  --ink-muted: #6B6360;
  --ink-faint: #B8B3AF;
  --green: #2D7A5F;
  --green-light: #E8F5F0;
  --green-mid: #4CAF87;
  --red: #C0432B;
  --red-light: #FBF0ED;
  --red-mid: #E07060;
  --gold: #C8963E;
  --gold-light: #FDF3E3;
  --border: #E8E2DC;
  --shadow: rgba(26,22,20,0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
}

/* ── DECORATIVE BG ── */
body::before {
  content: '';
  position: fixed;
  top: -200px; right: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(200,150,62,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -150px; left: -150px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(45,122,95,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

/* ── HEADER ── */
.header {
  text-align: center;
  margin-bottom: 2.5rem;
  animation: fadeUp 0.6s ease both;
}
.header-eyebrow {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}
.header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 38px;
  font-weight: 400;
  line-height: 1.1;
  margin-bottom: 8px;
}
.header h1 em {
  font-style: italic;
  color: var(--green);
}
.header p {
  font-size: 14px;
  color: var(--ink-muted);
}

/* ── MONTH NAV ── */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 1.5rem;
  animation: fadeUp 0.6s 0.1s ease both;
}
.month-nav button {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--warm-white);
  cursor: pointer;
  font-size: 15px;
  color: var(--ink-muted);
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.month-nav button:hover {
  border-color: var(--ink);
  color: var(--ink);
  transform: scale(1.05);
}
.month-label {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  min-width: 180px;
  text-align: center;
}

/* ── SUMMARY CARDS ── */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-bottom: 1.75rem;
  animation: fadeUp 0.6s 0.15s ease both;
}
.metric-card {
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1rem 0.875rem;
  text-align: center;
  transition: transform 0.2s;
}
.metric-card:hover { transform: translateY(-2px); }
.metric-label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 6px;
}
.metric-value {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  font-weight: 400;
}
.metric-value.income { color: var(--green); }
.metric-value.expense { color: var(--red); }

/* ── TABS ── */
.tabs {
  display: flex;
  gap: 0;
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 1.25rem;
  animation: fadeUp 0.6s 0.2s ease both;
}
.tab {
  flex: 1;
  padding: 9px 8px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  color: var(--ink-muted);
  border-radius: 9px;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.tab.active {
  background: var(--ink);
  color: var(--cream);
}
.tab:hover:not(.active) { color: var(--ink); background: var(--cream); }

.panel { display: none; animation: fadeUp 0.3s ease both; }
.panel.active { display: block; }

/* ── FORM ── */
.form-card {
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
}
.type-toggle { display: flex; gap: 8px; margin-bottom: 1.25rem; }
.type-btn {
  flex: 1;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: none;
  cursor: pointer;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  color: var(--ink-muted);
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.type-btn.active-in {
  background: var(--green-light);
  color: var(--green);
  border-color: var(--green-mid);
  font-weight: 500;
}
.type-btn.active-out {
  background: var(--red-light);
  color: var(--red);
  border-color: var(--red-mid);
  font-weight: 500;
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.form-group label { font-size: 12px; color: var(--ink-muted); letter-spacing: 0.05em; display: block; margin-bottom: 5px; }
.form-group input, .form-group select {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--cream);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus { border-color: var(--ink); }
.submit-btn {
  width: 100%;
  padding: 11px;
  margin-top: 8px;
  border: none;
  border-radius: 10px;
  background: var(--ink);
  color: var(--cream);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.02em;
}
.submit-btn:hover { background: #2D2521; transform: translateY(-1px); }
.submit-btn:active { transform: translateY(0); }

/* ── TRANSACTIONS ── */
.tx-list { display: flex; flex-direction: column; gap: 8px; }
.tx-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  transition: transform 0.15s;
}
.tx-item:hover { transform: translateX(2px); }
.tx-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.tx-dot.in { background: var(--green-mid); }
.tx-dot.out { background: var(--red-mid); }
.tx-info { flex: 1; min-width: 0; }
.tx-desc { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-meta { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
.tx-amount { font-family: 'DM Serif Display', serif; font-size: 16px; white-space: nowrap; }
.tx-amount.in { color: var(--green); }
.tx-amount.out { color: var(--red); }
.tx-del {
  background: none; border: none; cursor: pointer;
  color: var(--ink-faint); font-size: 16px; padding: 4px;
  border-radius: 6px; transition: all 0.2s;
}
.tx-del:hover { color: var(--red); background: var(--red-light); }
.tx-edit {
  background: none; border: none; cursor: pointer;
  color: var(--ink-faint); font-size: 16px; padding: 4px;
  border-radius: 6px; transition: all 0.2s;
}
.tx-edit:hover { color: var(--green); background: var(--green-light); }
.empty {
  text-align: center; padding: 3rem 1rem;
  color: var(--ink-muted); font-size: 14px;
}
.empty-icon { font-size: 32px; margin-bottom: 8px; opacity: 0.4; }

/* ── CHARTS ── */
.chart-wrap {
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 12px;
}
.chart-title { font-size: 13px; font-weight: 500; color: var(--ink-muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1.25rem; }
.legend { display: flex; gap: 16px; margin-bottom: 1rem; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; }

.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding-bottom: 24px; }
.bar-group { flex: 1; display: flex; gap: 3px; align-items: flex-end; position: relative; }
.bar { border-radius: 3px 3px 0 0; min-height: 2px; transition: opacity 0.2s; cursor: default; }
.bar:hover { opacity: 0.75; }
.bar-label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--ink-muted); white-space: nowrap; }

.cat-chart { display: flex; flex-direction: column; gap: 10px; }
.cat-row { display: flex; align-items: center; gap: 10px; }
.cat-name { font-size: 13px; color: var(--ink-muted); min-width: 100px; }
.cat-bar-wrap { flex: 1; background: var(--cream); border-radius: 4px; height: 6px; overflow: hidden; }
.cat-bar { height: 100%; border-radius: 4px; background: var(--red-mid); transition: width 0.4s ease; }
.cat-val { font-size: 12px; color: var(--ink-muted); min-width: 80px; text-align: right; font-variant-numeric: tabular-nums; }

/* ── EXPORT ── */
.export-card {
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
}
.summary-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 1.25rem; }
.summary-table td { padding: 10px 0; border-bottom: 1px solid var(--border); }
.summary-table td:last-child { text-align: right; font-weight: 500; }
.summary-table tr:last-child td { border-bottom: none; }
.print-btn {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: none;
  cursor: pointer;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.print-btn:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--ink);
  color: var(--cream);
  font-size: 13px;
  padding: 10px 20px;
  border-radius: 999px;
  opacity: 0;
  transition: all 0.3s;
  z-index: 100;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .app { padding: 1.25rem 1rem 3rem; }
  .header h1 { font-size: 28px; }
  .summary-grid { grid-template-columns: repeat(3,1fr); gap: 6px; }
  .metric-value { font-size: 15px; }
  .form-row { grid-template-columns: 1fr; }
  .tab { font-size: 12px; padding: 9px 4px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-eyebrow">✦ Keuangan Pribadi ✦</div>
    <h1><em>203</em></h1>
    <p>Catat pemasukan dan pengeluaranmu</p>
  </div>

  <div class="month-nav">
    <button onclick="changeMonth(-1)" title="Bulan sebelumnya">&#8592;</button>
    <span class="month-label" id="month-label"></span>
    <button onclick="changeMonth(1)" title="Bulan berikutnya">&#8594;</button>
  </div>

  <div class="summary-grid">
    <div class="metric-card">
      <div class="metric-label">Pemasukan</div>
      <div class="metric-value income" id="total-in">¥0</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Pengeluaran</div>
      <div class="metric-value expense" id="total-out">¥0</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Saldo</div>
      <div class="metric-value" id="total-balance">¥0</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('input')">+ Input</button>
    <button class="tab" onclick="showTab('list')">&#9776; Transaksi</button>
    <button class="tab" onclick="showTab('chart')">&#9641; Grafik</button>
    <button class="tab" onclick="showTab('export')">&#8659; Export</button>
  </div>

  <!-- INPUT -->
  <div id="panel-input" class="panel active">
    <div class="form-card">
      <div class="type-toggle">
        <button class="type-btn active-in" id="btn-in" onclick="setType('in')">&#8595; Pemasukan</button>
        <button class="type-btn" id="btn-out" onclick="setType('out')">&#8593; Pengeluaran</button>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Jumlah (¥)</label>
          <input type="number" id="amount" placeholder="10000" min="0">
        </div>
        <div class="form-group">
          <label>Tanggal</label>
          <input type="date" id="date">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Keterangan</label>
          <input type="text" id="desc" placeholder="Contoh: Gaji, Makan siang...">
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <select id="category">
            <option value="Gaji">Gaji</option>
            <option value="Freelance">Freelance</option>
            <option value="Investasi">Investasi</option>
            <option value="Bonus">Bonus</option>
            <option value="Lainnya (masuk)">Lainnya (masuk)</option>
            <option value="Makan & Minum">Makan & Minum</option>
            <option value="Transportasi">Transportasi</option>
            <option value="Belanja">Belanja</option>
            <option value="Tagihan">Tagihan</option>
            <option value="Hiburan">Hiburan</option>
            <option value="Kesehatan">Kesehatan</option>
            <option value="Tabungan">Tabungan</option>
            <option value="Pendidikan">Pendidikan</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
      </div>
      <button class="submit-btn" onclick="addTransaction()">Simpan Transaksi</button>
    </div>
  </div>

  <!-- LIST -->
  <div id="panel-list" class="panel">
    <div class="tx-list" id="tx-list">
      <div class="empty"><div class="empty-icon">&#128197;</div>Belum ada transaksi bulan ini</div>
    </div>
  </div>

  <!-- CHART -->
  <div id="panel-chart" class="panel">
    <div class="chart-wrap">
      <div class="chart-title">Pemasukan vs Pengeluaran &mdash; 6 Bulan</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--green-mid)"></div>Pemasukan</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--red-mid)"></div>Pengeluaran</div>
      </div>
      <div class="bar-chart" id="bar-chart"></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Pengeluaran per Kategori</div>
      <div class="cat-chart" id="cat-chart">
        <div style="text-align:center;color:var(--ink-muted);font-size:13px;padding:1rem 0">Belum ada data</div>
      </div>
    </div>
  </div>

  <!-- EXPORT -->
  <div id="panel-export" class="panel">
    <div class="export-card">
      <div class="chart-title" style="margin-bottom:1rem">Ringkasan Laporan</div>
      <table class="summary-table" id="export-table"></table>
      <button class="print-btn" onclick="printReport()">&#9113; Print / Simpan sebagai PDF</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let transactions = JSON.parse(localStorage.getItem('buku_kas_v1') || '[]');
let currentType = 'in';
let currentDate = new Date();

const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function save() { localStorage.setItem('buku_kas_v1', JSON.stringify(transactions)); }

function fmtRp(n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); }

function getKey(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function getMonthTxs() { return transactions.filter(t => t.month === getKey(currentDate)); }

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function updateSummary() {
  const txs = getMonthTxs();
  const income = txs.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
  const expense = txs.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
  const balance = income - expense;
  document.getElementById('total-in').textContent = fmtRp(income);
  document.getElementById('total-out').textContent = fmtRp(expense);
  const balEl = document.getElementById('total-balance');
  balEl.textContent = fmtRp(balance);
  balEl.style.color = balance >= 0 ? 'var(--green)' : 'var(--red)';

  const monthName = MONTHS[currentDate.getMonth()] + ' ' + currentDate.getFullYear();
  document.getElementById('export-table').innerHTML = `
    <tr><td style="color:var(--ink-muted)">Periode</td><td>${monthName}</td></tr>
    <tr><td style="color:var(--ink-muted)">Pemasukan</td><td style="color:var(--green)">${fmtRp(income)}</td></tr>
    <tr><td style="color:var(--ink-muted)">Pengeluaran</td><td style="color:var(--red)">${fmtRp(expense)}</td></tr>
    <tr><td style="color:var(--ink-muted)">Saldo Akhir</td><td style="color:${balance>=0?'var(--green)':'var(--red)'}">${fmtRp(balance)}</td></tr>
    <tr><td style="color:var(--ink-muted)">Jumlah Transaksi</td><td>${txs.length}</td></tr>
  `;
}

function renderList() {
  const txs = getMonthTxs().sort((a,b)=>b.date.localeCompare(a.date));
  const el = document.getElementById('tx-list');
  if (!txs.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">&#128197;</div>Belum ada transaksi bulan ini</div>';
    return;
  }
  el.innerHTML = txs.map(t => `
    <div class="tx-item">
      <div class="tx-dot ${t.type}"></div>
      <div class="tx-info">
        <div class="tx-desc">${t.desc || t.category}</div>
        <div class="tx-meta">${t.category} &middot; ${t.date}</div>
      </div>
      <div class="tx-amount ${t.type}">${t.type==='in'?'+':'-'}${fmtRp(t.amount)}</div>
      <button class="tx-edit" onclick="editTx('${t.id}')" title="Edit">&#9998;</button>
      <button class="tx-del" onclick="deleteTx('${t.id}')" title="Hapus">&#10005;</button>
    </div>
  `).join('');
}

function renderBarChart() {
  const el = document.getElementById('bar-chart');
  const data = [];
  for (let i=5; i>=0; i--) {
    const d = new Date(currentDate.getFullYear(), currentDate.getMonth()-i, 1);
    const key = getKey(d);
    const txs = transactions.filter(t=>t.month===key);
    data.push({
      label: MONTHS[d.getMonth()].slice(0,3),
      income: txs.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0),
      expense: txs.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0)
    });
  }
  const maxVal = Math.max(...data.map(m=>Math.max(m.income,m.expense)),1);
  el.innerHTML = data.map(m => {
    const inH = Math.round((m.income/maxVal)*110);
    const outH = Math.round((m.expense/maxVal)*110);
    return `<div class="bar-group">
      <div class="bar" style="width:46%;height:${inH}px;background:var(--green-mid)" title="${fmtRp(m.income)}"></div>
      <div class="bar" style="width:46%;height:${outH}px;background:var(--red-mid)" title="${fmtRp(m.expense)}"></div>
      <span class="bar-label">${m.label}</span>
    </div>`;
  }).join('');
}

function renderCatChart() {
  const txs = getMonthTxs().filter(t=>t.type==='out');
  const el = document.getElementById('cat-chart');
  if (!txs.length) {
    el.innerHTML = '<div style="text-align:center;color:var(--ink-muted);font-size:13px;padding:1rem 0">Belum ada data pengeluaran</div>';
    return;
  }
  const cats = {};
  txs.forEach(t=>{ cats[t.category]=(cats[t.category]||0)+t.amount; });
  const sorted = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const max = sorted[0][1];
  el.innerHTML = sorted.map(([cat,val])=>`
    <div class="cat-row">
      <span class="cat-name">${cat}</span>
      <div class="cat-bar-wrap"><div class="cat-bar" style="width:${Math.round((val/max)*100)}%"></div></div>
      <span class="cat-val">${fmtRp(val)}</span>
    </div>
  `).join('');
}

function updateAll() { updateSummary(); renderList(); }

function changeMonth(dir) {
  currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+dir, 1);
  document.getElementById('month-label').textContent = MONTHS[currentDate.getMonth()] + ' ' + currentDate.getFullYear();
  updateAll();
  const active = document.querySelector('.panel.active');
  if (active && active.id === 'panel-chart') { renderBarChart(); renderCatChart(); }
}

function setType(t) {
  currentType = t;
  document.getElementById('btn-in').className = 'type-btn' + (t==='in'?' active-in':'');
  document.getElementById('btn-out').className = 'type-btn' + (t==='out'?' active-out':'');
  const cat = document.getElementById('category');
  if (t === 'in') {
    cat.value = cat.options[0].value;
  } else {
    for (let i=0; i<cat.options.length; i++) {
      if (cat.options[i].value === 'Makan & Minum') { cat.selectedIndex = i; break; }
    }
  }
}

function addTransaction() {
  const amount = parseFloat(document.getElementById('amount').value);
  const date = document.getElementById('date').value;
  const desc = document.getElementById('desc').value.trim();
  const category = document.getElementById('category').value;
  if (!amount || amount <= 0) { showToast('Masukkan jumlah yang valid'); return; }
  if (!date) { showToast('Pilih tanggal dulu'); return; }
  const [y,m] = date.split('-');
  transactions.push({ id: Date.now().toString(), type: currentType, amount, date, desc, category, month: y+'-'+m });
  save();
  document.getElementById('amount').value = '';
  document.getElementById('desc').value = '';
  updateAll();
  showToast(currentType === 'in' ? '&#10003; Pemasukan disimpan' : '&#10003; Pengeluaran disimpan');
  showTab('list');
}


function editTx(id) {
  const tx = transactions.find(t => t.id === id);
  if (!tx) return;

  currentType = tx.type;
  setType(tx.type);

  document.getElementById('amount').value = tx.amount;
  document.getElementById('date').value = tx.date;
  document.getElementById('desc').value = tx.desc || '';
  document.getElementById('category').value = tx.category;

  transactions = transactions.filter(t => t.id !== id);
  save();
  updateAll();

  showTab('input');
  showToast('Edit transaksi lalu simpan kembali');
}

function deleteTx(id) {
  if (!confirm('Hapus transaksi ini?')) return;
  transactions = transactions.filter(t=>t.id!==id);
  save();
  updateAll();
  showToast('Transaksi dihapus');
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['input','list','chart','export'][i]===name));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  if (name === 'chart') { renderBarChart(); renderCatChart(); }
}

function printReport() {
  const monthName = MONTHS[currentDate.getMonth()] + ' ' + currentDate.getFullYear();
  const txs = getMonthTxs().sort((a,b)=>b.date.localeCompare(a.date));
  const income = txs.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
  const expense = txs.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
  const balance = income - expense;
  const rows = txs.map(t=>`<tr><td>${t.date}</td><td>${t.desc||'-'}</td><td>${t.category}</td><td style="color:${t.type==='in'?'#2D7A5F':'#C0432B'};text-align:right">${t.type==='in'?'+':'-'}${fmtRp(t.amount)}</td></tr>`).join('');
  const win = window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Laporan - ${monthName}</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>body{font-family:'DM Sans',sans-serif;padding:3rem;max-width:700px;margin:0 auto;color:#1A1614}h1{font-family:'DM Serif Display',serif;font-size:32px;font-weight:400;margin-bottom:4px}h1 em{font-style:italic;color:#2D7A5F}.period{color:#6B6360;margin-bottom:2rem;font-size:14px}.sum{display:flex;gap:3rem;margin-bottom:2rem;padding:1.25rem;background:#FDF8F2;border-radius:12px}.s p{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6B6360;margin:0}.s h3{font-size:22px;font-family:'DM Serif Display',serif;font-weight:400;margin:4px 0 0}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6B6360;padding:8px 0;border-bottom:2px solid #E8E2DC}td{padding:10px 0;border-bottom:1px solid #E8E2DC}td:last-child{text-align:right}@media print{body{padding:1.5rem}}</style></head>
  <body><h1>Buku Kas <em>Pribadi</em></h1><div class="period">${monthName}</div>
  <div class="sum">
    <div class="s"><p>Pemasukan</p><h3 style="color:#2D7A5F">${fmtRp(income)}</h3></div>
    <div class="s"><p>Pengeluaran</p><h3 style="color:#C0432B">${fmtRp(expense)}</h3></div>
    <div class="s"><p>Saldo</p><h3 style="color:${balance>=0?'#2D7A5F':'#C0432B'}">${fmtRp(balance)}</h3></div>
  </div>
  <table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th style="text-align:right">Jumlah</th></tr></thead><tbody>${rows||'<tr><td colspan="4" style="text-align:center;color:#6B6360;padding:2rem 0">Tidak ada transaksi</td></tr>'}</tbody></table>
  </body></html>`);
  win.document.close();
  setTimeout(() => win.print(), 500);
}

// Init
document.getElementById('date').value = new Date().toISOString().split('T')[0];
document.getElementById('month-label').textContent = MONTHS[currentDate.getMonth()] + ' ' + currentDate.getFullYear();
updateAll();
</script>
</body>
</html>
